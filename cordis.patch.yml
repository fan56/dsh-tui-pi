# dsh-tui-pi bundle patch: mounts the pi-style TUI plugin over the profile's
# base bundle under the stable plugin id `tui-pi`. The plugin renders the
# terminal UI in-process with @earendil-works/pi-tui and talks to the dsh tree
# directly (ctx.agents / ctx.commands / session events), keeping dsh's slash
# commands untouched.
#
# dsh-dcp is NOT mounted here: it is a dependency of this package and ships
# its own bundle patch (@aiwayds/dsh-dcp/cordis.patch.yml). Adding dsh-dcp to
# the profile's bundles mounts it; mounting it here too would duplicate the
# entry id and crash the loader.
#
# dsh-profile-switch IS mounted here — the one deliberate exception to the
# rule above: its commands replace the panels this suite used to carry
# (src/profile.ts, removed in 2.16.0), so an upgrade must reactivate them
# with zero user action or /profile-switch silently vanishes. It ships as a
# default dependency of this package and this insert mounts it from the
# profile root (every dsh-managed profile boots with nodeLinker: hoisted).
# A profile that ALSO lists @aiwayds/dsh-profile-switch in bundles is
# tolerated: the plugin's apply is idempotent across mounts (0.1.1), so the
# second entry no-ops instead of crashing on the duplicate command
# registration. (On surfaces without tui-pi — a web-only profile —
# activation stays manual as usual: add it to bundles.)
#
# dsh-tool-ask-user is mounted here: the upstream tool is a soft-linked
# closure dependency (not a regular npm dep) and needs an explicit entry in
# the bundle to be wired into the model-facing tool catalog. Without this
# insert, the `ask_user_question` tool never registers with the model and
# the user-questions seam has no visible surface in this profile.
#
# The stock session-projection-cache row is REPLACED (disable + wrapper), not
# extended: the alpha.4 record schema fail-fasts at storage-open on records
# written by 0.1.1-rc.2-era hosts (missing identity.isSeeded /
# identity.inheritedEventCount), and the crash happens inside the stock
# plugin's own Service.init — the loader collects it from the parallel
# allSettled and tears down the whole boot before any later-initializing
# plugin could repair the data. The wrapper entry below (tui-pi-projcache)
# mounts @aiwayds/dsh-tui-pi/projcache, which backfills the legacy fields at
# module-evaluation time — the one hook the loader reaches strictly before
# Service.init — and otherwise re-exports the stock module unchanged.
#
# The `name` field on the disable patch is a guard, not an override: if a
# future host renames or drops the row, the patch is skipped with a loader
# warning instead of silently disabling an unrelated entry.

- id: session-projection-cache
  name: '@deepseek-ai/dsh-session-projection-cache'
  disabled: true

- insert:
    - id: tui-pi
      name: '@aiwayds/dsh-tui-pi'
    - id: profile-switch
      name: '@aiwayds/dsh-profile-switch'
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    # Config mirrors the stock row's values (the plugin's Config schema
    # requires both fields); a later upstream retune of the base row does not
    # propagate through a disabled entry, so revisit on host upgrades.
    - id: tui-pi-projcache
      name: '@aiwayds/dsh-tui-pi/projcache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
