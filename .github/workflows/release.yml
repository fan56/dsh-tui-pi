# Release: publish to npm + create the GitHub Release when a v* tag is pushed.
#
# The package is published (@aiwayds/dsh-tui-pi, scoped, no "private" field),
# so this workflow runs check+test as a gate, builds lib/, stamps package.json
# to the tag's version (the tag is the source of truth — small patches skip
# the version-bump commit entirely), publishes with npm provenance (OIDC),
# then opens a GitHub Release whose body is the annotated tag message. Two
# jobs: if the GitHub Release step fails after a successful publish, re-run
# the `release` job alone — the npm publish is never repeated.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Check, Test & Publish
    # Only the upstream repo publishes; forks skip this job (and the release
    # job below is skipped with it via needs).
    if: github.repository == 'fan56/dsh-tui-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # No packageManager field in package.json; lockfileVersion 9.0.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha)
        # Policy (2026-09-03): the alpha line is retired. The plugin targets
        # the dsh rc/stable line; the release gate installs the newest of the
        # `latest` (stable) and `next` (rc) dist-tags at runtime — the same
        # host line a fresh install of this plugin line will run on. ci.yml
        # adds a daily schedule so closure breakage surfaces before a release.
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # Gate: never publish from a tree that does not typecheck or pass tests.
      # `pnpm check`'s precheck hook re-runs scripts/link-dsh-closure.mjs,
      # which resolves the global dsh closure (nested or npm's flat layout) —
      # no manual symlink step needed.
      - name: Check & Test (pretest builds lib/)
        run: pnpm check && pnpm test

      - name: Build
        run: pnpm build

      - name: Stamp package.json to the tag version
        # The tag is the single source of truth for what gets published. Small
        # patches skip the version-bump commit — push the fix, tag it, and the
        # workflow rewrites package.json here (--allow-same-version makes a
        # matching version a no-op). main's package.json may lag behind npm;
        # the next deliberate bump (`npm version minor|major`) starts from
        # whatever main carries, and the stamp keeps publishes tag-accurate.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version
          echo "publishing @aiwayds/dsh-tui-pi@${TAG_VERSION} (tag ${GITHUB_REF_NAME})"

      - name: Publish to npm
        # Idempotent: if the version is already on the registry, warn and
        # skip instead of failing. Two shapes of "already published":
        # 1. Visible to `npm view` up front (re-run, or a concurrent publish
        #    that predates this step) — pre-check no-ops so the downstream
        #    release job can still complete.
        # 2. Landing WHILE this very `npm publish --provenance` runs: its
        #    known follow-up PUT 403s with "cannot publish over previously
        #    published versions" after the first PUT actually succeeded
        #    (package + provenance did land — observed on v0.15.1, v0.16.0,
        #    and v0.27.0 where a parallel session published manually).
        #    npm view cannot see that in advance; match the registry error
        #    text instead. npm versions are immutable (--force will not
        #    overwrite), so degrade-to-warning is the only correct outcome.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@aiwayds/dsh-tui-pi@${TAG_VERSION}" version >/dev/null 2>&1; then
            echo "::warning::@aiwayds/dsh-tui-pi@${TAG_VERSION} is already on npm — skipping publish"
            exit 0
          fi
          set +e
          PUB_OUT="$(npm publish --access public --provenance 2>&1)"
          PUB_RC=$?
          set -e
          printf '%s\n' "$PUB_OUT"
          if [ "${PUB_RC}" -ne 0 ] && printf '%s' "$PUB_OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "::warning::@aiwayds/dsh-tui-pi@${TAG_VERSION} was published concurrently (or landed mid-publish) — treating as success"
            exit 0
          fi
          exit "${PUB_RC}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          # Full fetch so the annotated tag object is available for the
          # tag-message extraction step below.
          fetch-depth: 0

      - name: Read tag message
        id: tag_message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'BODY<<EOF_TAG_MESSAGE'
            # Annotated tag → its message; lightweight tag → falls back to the
            # commit message. %(contents:subject) + blank line + %(contents:body).
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG"
            echo 'EOF_TAG_MESSAGE'
          } >> "$GITHUB_OUTPUT"

      # Skip if the release was already published (e.g. via `gh release create`
      # locally with a hand-crafted body — softprops/action-gh-release@v3
      # would otherwise overwrite that body with the tag message).
      - name: Check if GitHub Release already exists
        id: check_release
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Release $TAG already exists — skipping (preserving existing body)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.tag_message.outputs.BODY }}
