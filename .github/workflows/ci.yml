# CI: build, typecheck, unit suite, and a real-host boot smoke on every push
# to main, every pull request, and a daily schedule.
#
# The dsh CLI version is resolved at runtime from the npm registry's rolling
# `alpha` dist-tag — never hand-pinned (the rc lesson: `latest` still points
# at the rc line the plugin dropped with 0.1.2-alpha.3, so installing
# `latest` would typecheck and boot against a host the plugin no longer
# supports). The daily schedule re-tests against whatever the closure has
# become since the last push, so a new dsh alpha that breaks the plugin
# surfaces as a red run within a day instead of at the next release. The
# smoke boots a scratch profile with the plugin mounted via the real dsh CLI
# (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a hope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 03:17 UTC — off the top-of-hour congestion.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling @alpha dist-tag, never hand-pinned)
        run: |
          DSH_VERSION="$(npm view @deepseek-ai/dsh@alpha version)"
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # Point node_modules/@deepseek-ai/* at the installed CLI's closure so
      # tsc sees exactly the type graph the host runs (one cordis instance —
      # a second local copy breaks the declare-module augmentation merge).
      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      # pnpm does not run npm pre/post hooks by default, so build explicitly
      # before test (the test files import lib/).
      - name: Build & Check (tsc)
        run: pnpm build && pnpm check

      - name: Test (unit suite)
        run: pnpm test

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
