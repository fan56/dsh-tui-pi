# CI: build, typecheck, unit suite, and a real-host boot smoke on every push
# to main, every pull request, and a daily schedule.
#
# 2026-11-04 incident pin: the dsh CLI closure supply is PINNED to the last
# complete wave (0.2.1-rc.5) instead of resolving newest-of(latest,next) at
# run time — upstream `next` moved to 0.2.2-rc.1 and that wave breaks this
# 0.2.1-rc.5-era source (see the install step below for the breaking
# changes). Ride the 0.2.2 wave (adapt the source, tracked as the wave-
# migration task), then restore the rolling newest-of(latest,next)
# resolution — the original resolution block is recoverable verbatim from
# this file's git history (the parent of the pin commit), and the daily
# schedule becomes the rolling early-warning again then. The smoke boots a
# scratch profile with the plugin mounted via the real dsh CLI
# (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a
# hope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 03:17 UTC — off the top-of-hour congestion.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (PINNED 0.2.1-rc.5 closure wave — 2026-11-04 incident pin)
        run: |
          # 2026-11-04 incident pin (suspends the rolling newest-of(latest,next)
          # resolution, policy 2026-09-03): upstream `next` moved to
          # 0.2.2-rc.1 and the roller picked it (red since the scheduled run
          # 41817078497; also 41825380375, 41850906421). That wave breaks this
          # 0.2.1-rc.5-era source:
          #   - `ModelSelectionRef` removed from @deepseek-ai/dsh-agent
          #     (src/session.ts:14 import),
          #   - `Fiber._config` renamed to `config` (src/reload.ts:179/192),
          #   - two call sites lost an argument (src/session.ts:1654/2333).
          # Policy: an upstream incident is turned green in the same round by
          # pinning the closure supply to the last COMPLETE published wave.
          # Restore the rolling resolution once the 0.2.2 wave completes and
          # the source is adapted — the original block (dist-tag reads,
          # prerelease-aware newest-of compare, ALT fallback) is recoverable
          # verbatim via `git show 3e9f759:.github/workflows/ci.yml`.
          DSH_VERSION="0.2.1-rc.5"
          # Same wave-pinned closure install as before: the pinned version's
          # own @deepseek-ai/* ranges are clamped to their base versions via
          # npm overrides, so tilde/caret ranges cannot float into another
          # tower (the ^0.1.5-rc.2 float trap on record).
          DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install"
          install_dsh() {
            local ver="$1" dir="$2"
            node -e '
              const { execFileSync } = require("node:child_process")
              const { writeFileSync, mkdirSync } = require("node:fs")
              const [ver, dir] = process.argv.slice(1)
              const deps = JSON.parse(execFileSync("npm", ["view", `@deepseek-ai/dsh@${ver}`, "dependencies", "--json"], { encoding: "utf8" }))
              const overrides = {}
              for (const [name, range] of Object.entries(deps ?? {})) {
                if (name.startsWith("@deepseek-ai/") && /^[~^]/.test(range)) overrides[name] = range.replace(/^[~^]/, "")
              }
              mkdirSync(dir, { recursive: true })
              writeFileSync(`${dir}/package.json`, JSON.stringify({
                name: "dsh-ci-install",
                private: true,
                dependencies: { "@deepseek-ai/dsh": ver },
                overrides,
              }, null, 2))
            ' "$ver" "$dir"
            (cd "$dir" && npm install --no-audit --no-fund >/dev/null)
          }
          echo "dsh closure: ${DSH_VERSION} (pinned)"
          if ! install_dsh "$DSH_VERSION" "$DSH_DIR"; then
            echo "::error:: pinned closure wave dsh@${DSH_VERSION} won't install — the wave left the registry; re-pin to the next complete wave"
            exit 1
          fi
          # Later steps (link-dsh-closure, boot smoke) use the scratch CLI.
          echo "${DSH_DIR}/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLOSURE_DIR=${DSH_DIR}/node_modules/@deepseek-ai" >> "$GITHUB_ENV"

      # Point node_modules/@deepseek-ai/* at the installed CLI's closure so
      # tsc sees exactly the type graph the host runs (one cordis instance —
      # a second local copy breaks the declare-module augmentation merge).
      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      # pnpm does not run npm pre/post hooks by default, so build explicitly
      # before test (the test files import lib/).
      - name: Build & Check (tsc)
        run: pnpm build && pnpm check

      - name: Test (unit suite)
        run: pnpm test

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
