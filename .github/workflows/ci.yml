# CI: typecheck + tests on every push to main, every pull request, and a
# daily schedule.
#
# The source imports `@deepseek-ai/*` packages (cordis, dsh-session, …) that
# are NOT declared in package.json — they resolve through symlinks into a dsh
# install's own node_modules (see scripts/link-dsh-closure.mjs). A clean CI
# runner has no global dsh, so we install the dsh CLI from npm; `pnpm check`'s
# precheck hook then re-runs the linker, which resolves the global closure
# (nested or npm's flat layout) into node_modules/@deepseek-ai.
#
# The dsh CLI is resolved at run time from npm's `latest` dist-tag — no pin
# to go stale. The daily schedule re-tests against whatever the closure has
# become since the last push, so a new dsh release that breaks the plugin
# surfaces as a red run within a day instead of at the next release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 03:17 UTC — off the top-of-hour congestion.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # No packageManager field in package.json; lockfileVersion 9.0.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest dsh CLI (provides the @deepseek-ai/* closure)
        run: |
          echo "latest @deepseek-ai/dsh: $(npm view @deepseek-ai/dsh version)"
          npm install -g @deepseek-ai/dsh --no-audit --no-fund

      - name: Check (tsc --noEmit)
        run: pnpm check

      - name: Test (pretest builds lib/, then node --test)
        run: pnpm test
